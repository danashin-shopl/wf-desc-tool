<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Description 다나와! 와이어프레임 Description 자동 생성기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    background: #f5f4f0;
    color: #1a1a18;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: #fff;
    border-bottom: 0.5px solid #e0dfd8;
    flex-shrink: 0;
  }
  .top-bar h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }

  .api-key-wrap {
    display: flex; align-items: center; gap: 8px;
    background: #f5f4f0; border: 0.5px solid #d3d1c7;
    border-radius: 8px; padding: 6px 12px;
  }
  .api-key-wrap label { font-size: 11px; color: #888780; font-weight: 500; white-space: nowrap; }
  .api-key-wrap input {
    border: none; outline: none; font-size: 12px;
    font-family: inherit; color: #1a1a18; background: transparent; width: 220px;
  }
  .api-key-wrap input::placeholder { color: #b4b2a9; }

  /* Context 아코디언 */
  .context-section {
    flex-shrink: 0;
    background: #fff;
    border-bottom: 0.5px solid #e0dfd8;
  }

  .context-toggle {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 20px;
    cursor: pointer; user-select: none;
  }
  .context-toggle:hover .context-label { color: #5f5e5a; }

  .context-label {
    font-size: 12px; font-weight: 700; color: #1a1a18;
    letter-spacing: 0.3px; text-transform: uppercase;
    transition: color 0.15s;
  }

  .context-badges {
    display: flex; gap: 5px;
    transition: opacity 0.15s;
    opacity: 0; pointer-events: none;
  }
  .context-section.collapsed .context-badges { opacity: 1; }

  .context-badge {
    display: flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 500; color: #b4b2a9;
    padding: 2px 8px; border-radius: 20px;
    border: 0.5px solid #e0dfd8;
    text-transform: uppercase; letter-spacing: 0.3px;
    transition: border-color 0.2s, color 0.2s;
  }
  .context-badge.loaded { border-color: #3daf6e; color: #3daf6e; }

  .badge-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: #d3d1c7; flex-shrink: 0;
    transition: background 0.2s;
  }
  .context-badge.loaded .badge-dot { background: #3daf6e; }

  .context-chevron {
    margin-left: auto; color: #c8c6be; flex-shrink: 0;
    transition: transform 0.22s ease;
  }
  .context-section.collapsed .context-chevron { transform: rotate(-90deg); }

  .context-body {
    max-height: 140px; overflow: hidden;
    transition: max-height 0.25s ease, opacity 0.2s ease;
    opacity: 1;
  }
  .context-section.collapsed .context-body { max-height: 0; opacity: 0; }

  .context-cols {
    display: flex;
    padding: 4px 0 14px;
  }

  .input-col {
    padding: 8px 20px 0;
    display: flex; flex-direction: column; gap: 6px;
    width: 380px; flex-shrink: 0;
  }

  /* Policy URL/CSV 모드 토글 */
  .mode-toggle {
    display: flex;
    border: 0.5px solid #d3d1c7;
    border-radius: 6px; overflow: hidden;
    width: fit-content;
  }
  .mode-btn {
    padding: 3px 11px; font-size: 11px; font-family: inherit;
    font-weight: 500; border: none; background: #f5f4f0;
    color: #b4b2a9; cursor: pointer; transition: background 0.12s, color 0.12s;
  }
  .mode-btn + .mode-btn { border-left: 0.5px solid #d3d1c7; }
  .mode-btn.active { background: #1a1a18; color: #f5f4f0; }

  .input-col-label {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; color: #b4b2a9;
    letter-spacing: 0.5px; text-transform: uppercase;
  }

  .status-dot {
    width: 14px; height: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #3daf6e; opacity: 0; transition: opacity 0.2s;
  }
  .status-dot.loaded { opacity: 1; }

  .url-row { display: flex; gap: 6px; align-items: center; height: 30px; }
  .url-input {
    flex: 1; border: 0.5px solid #d3d1c7; border-radius: 6px;
    padding: 5px 10px; font-size: 12px; font-family: inherit;
    color: #1a1a18; background: #fafaf8; outline: none;
  }
  .url-input:focus { border-color: #888780; background: #fff; }
  .url-input::placeholder { color: #b4b2a9; }

  .fetch-btn {
    font-size: 11px; font-family: inherit; padding: 4px 10px;
    background: #f5f4f0; border: 0.5px solid #d3d1c7; border-radius: 5px;
    cursor: pointer; color: #5f5e5a; white-space: nowrap; flex-shrink: 0;
    transition: background 0.1s;
  }
  .fetch-btn:hover { background: #e8e7e3; }
  .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; }


  .csv-row { display: flex; gap: 6px; align-items: center; }
  .csv-upload-btn {
    font-size: 11px; font-family: inherit; padding: 4px 10px;
    background: #f5f4f0; border: 0.5px solid #d3d1c7; border-radius: 5px;
    cursor: pointer; color: #5f5e5a; flex-shrink: 0; transition: background 0.1s;
  }
  .csv-upload-btn:hover { background: #e8e7e3; }
  .csv-fname {
    font-size: 11px; color: #888780; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .csv-clear-btn {
    background: none; border: none; cursor: pointer;
    font-size: 12px; color: #b4b2a9; padding: 0; line-height: 1; flex-shrink: 0;
  }
  .csv-clear-btn:hover { color: #5f5e5a; }

  /* 메인 3단 */
  .main {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  .col {
    padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    height: 100%;
    overflow: hidden;
  }

  .col-title {
    font-size: 12px; font-weight: 700; color: #1a1a18;
    letter-spacing: 0.3px; text-transform: uppercase; flex-shrink: 0;
  }

  /* 생성 버튼 컬럼 */
  .generate-col {
    width: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 16px 0;
  }

  .run-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #1a1a18;
    color: #f5f4f0;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .run-btn:hover { opacity: 0.75; transform: scale(1.05); }
  .run-btn:active { transform: scale(0.95); }
  .run-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  .run-btn-label {
    font-size: 10px; color: #b4b2a9; font-weight: 500;
    letter-spacing: 0.3px; text-align: center;
  }

  .run-btn-wrap { position: relative; }
  .run-btn-tooltip {
    display: none;
    position: absolute;
    left: 50%; transform: translateX(-50%);
    bottom: calc(100% + 8px);
    background: #1a1a18; color: #f5f4f0;
    font-size: 11px; line-height: 1.5;
    padding: 6px 10px; border-radius: 7px;
    white-space: nowrap; pointer-events: none; z-index: 100;
    text-align: center;
  }
  .run-btn-tooltip::after {
    content: '';
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #1a1a18;
  }
  .run-btn-wrap.show-tooltip:hover .run-btn-tooltip { display: block; }

  .error-msg {
    display: none; padding: 6px 8px; background: #fcebeb;
    border-radius: 7px; font-size: 10px; color: #a32d2d;
    text-align: center; max-width: 56px; line-height: 1.4;
  }

  .card {
    background: #fff; border-radius: 10px;
    border: 0.5px solid #e0dfd8; padding: 12px 14px;
    display: flex; flex-direction: column;
    min-height: 0; overflow: hidden;
  }

  .card-label-row {
    display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 6px; flex-shrink: 0;
  }
  .card-label-row label { font-size: 11px; color: #888780; font-weight: 500; }

  textarea {
    width: 100%; border: none; outline: none; resize: none;
    font-size: 12px; font-family: inherit; color: #1a1a18;
    background: transparent; line-height: 1.7;
    flex: 1; min-height: 40px; overflow-y: auto;
  }
  textarea::placeholder { color: #b4b2a9; }

  /* 이미지 영역 — 더 큰 비율 */
  .upload-area {
    border-radius: 10px; border: 1.5px dashed #d3d1c7;
    text-align: center; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    flex: 3; min-height: 140px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #fff;
  }
  .upload-area:hover { background: #f9f8f4; border-color: #b4b2a9; }
  .upload-area.drag-over { background: #eef5fb; border-color: #378add; }
  .upload-area p { font-size: 12px; color: #888780; margin-top: 4px; }
  .upload-area span { font-size: 11px; color: #b4b2a9; }

  .preview-wrap { display: none; position: relative; flex: 3; min-height: 140px; }
  .preview-wrap img {
    width: 100%; height: 100%; object-fit: contain;
    border-radius: 10px; border: 0.5px solid #e0dfd8; display: block;
  }
  .remove-btn {
    position: absolute; top: 6px; right: 6px;
    background: #fff; border: 0.5px solid #d3d1c7; border-radius: 50%;
    width: 24px; height: 24px; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    color: #5f5e5a; transition: background 0.1s;
  }
  .remove-btn:hover { background: #f5f4f0; }

  /* 컴포넌트 목록 — 더 작은 비율 */
  .components-card { flex: 1; min-height: 80px; }

  .output-header {
    display: flex; align-items: center;
    justify-content: space-between; flex-shrink: 0;
  }
  .btn-group { display: flex; gap: 6px; }

  .copy-btn {
    font-size: 11px; font-family: inherit; padding: 3px 10px;
    background: #fff; border: 0.5px solid #d3d1c7; border-radius: 5px;
    cursor: pointer; color: #5f5e5a; transition: background 0.1s;
  }
  .copy-btn:hover { background: #f5f4f0; }

  .download-btn {
    font-size: 11px; font-family: inherit; padding: 3px 10px;
    background: #1a1a18; border: 0.5px solid #1a1a18; border-radius: 5px;
    cursor: pointer; color: #f5f4f0; transition: opacity 0.1s;
  }
  .download-btn:hover { opacity: 0.8; }

  .output-box {
    background: #fff; border-radius: 10px; border: 0.5px solid #e0dfd8;
    padding: 14px; font-size: 12px; line-height: 1.9;
    white-space: pre-wrap; color: #1a1a18; flex: 1; overflow-y: auto;
    outline: none; cursor: text; min-height: 0;
  }
  .output-box:focus { border-color: #b4b2a9; }
  .output-empty {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: #b4b2a9; font-size: 12px;
  }

  /* GitHub 업로드 모달 */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.35); z-index: 1000;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 12px;
    padding: 22px 24px; width: 360px;
    display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.16);
  }
  .modal-title { font-size: 13px; font-weight: 700; color: #1a1a18; }
  .modal-field { display: flex; flex-direction: column; gap: 5px; }
  .modal-field label { font-size: 11px; color: #888780; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }
  .modal-field input {
    border: 0.5px solid #d3d1c7; border-radius: 6px;
    padding: 6px 10px; font-size: 12px; font-family: inherit;
    color: #1a1a18; background: #fafaf8; outline: none;
  }
  .modal-field input:focus { border-color: #888780; background: #fff; }
  .modal-field input::placeholder { color: #b4b2a9; }
  .modal-status {
    font-size: 11px; color: #3daf6e; display: none;
    padding: 6px 10px; border-radius: 6px; background: #f0fbf5;
  }
  .modal-status.error { color: #a32d2d; background: #fdf1f1; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-cancel {
    font-size: 12px; font-family: inherit; padding: 6px 14px;
    background: #f5f4f0; border: 0.5px solid #d3d1c7; border-radius: 6px;
    cursor: pointer; color: #5f5e5a; transition: background 0.1s;
  }
  .modal-cancel:hover { background: #e8e7e3; }
  .modal-confirm {
    font-size: 12px; font-family: inherit; padding: 6px 14px;
    background: #1a1a18; border: none; border-radius: 6px;
    cursor: pointer; color: #f5f4f0; transition: opacity 0.1s;
  }
  .modal-confirm:hover { opacity: 0.8; }
  .modal-confirm:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<div class="top-bar">
  <h1>Description 다나와! 와이어프레임 Description 자동 생성기</h1>
  <div style="display:flex; align-items:center; gap:10px;">
    <div class="api-key-wrap" id="api-key-wrap">
      <label for="api-key">API Key</label>
      <input type="password" id="api-key" placeholder="sk-ant-..." autocomplete="off">
    </div>
    <div class="mode-toggle">
      <button class="mode-btn active" id="model-gemini" onclick="switchModel('gemini')">Gemini</button>
      <button class="mode-btn" id="model-claude" onclick="switchModel('claude')">Claude</button>
    </div>
  </div>
</div>

<!-- Context 아코디언 -->
<div class="context-section" id="context-section">

  <div class="context-toggle" onclick="toggleContext()">
    <span class="context-label">Context</span>
    <div class="context-badges">
      <span class="context-badge" id="badge-common">
        <span class="badge-dot"></span>Common
      </span>
      <span class="context-badge" id="badge-policy">
        <span class="badge-dot"></span>Policy
      </span>
    </div>
    <svg class="context-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </div>

  <div class="context-body">
    <div class="context-cols">

      <div class="input-col">
        <div class="input-col-label">
          Common
          <div class="status-dot" id="policy-dot">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </div>
        <div class="url-row">
          <input type="text" class="url-input" id="policy-url" placeholder="GitHub Raw URL 입력 후 Enter / 불러오기">
          <button class="fetch-btn" id="policy-fetch-btn" onclick="fetchUrl('policy')">불러오기</button>
        </div>
      </div>

      <div class="input-col">
        <div class="input-col-label">
          Policy
          <div class="status-dot" id="requirements-dot">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="mode-toggle" style="margin-left:auto;">
            <button class="mode-btn active" id="policy-mode-url" onclick="switchPolicyMode('url')">URL</button>
            <button class="mode-btn" id="policy-mode-csv" onclick="switchPolicyMode('csv')">CSV</button>
          </div>
        </div>
        <div style="height:30px; display:flex; align-items:center; overflow:hidden;">
          <div class="url-row" id="policy-url-row" style="width:100%;">
            <input type="text" class="url-input" id="requirements-url" placeholder="GitHub Raw URL 입력 후 Enter / 불러오기">
            <button class="fetch-btn" id="requirements-fetch-btn" onclick="fetchUrl('requirements')">불러오기</button>
          </div>
          <div class="csv-row" id="policy-csv-row" style="display:none; width:100%;">
            <button class="csv-upload-btn" onclick="document.getElementById('csv-requirements').click()">↑ CSV 업로드</button>
            <input type="file" id="csv-requirements" accept=".csv" style="display:none;" onchange="loadCsv(event,'requirements')">
            <span class="csv-fname" id="requirements-fname"></span>
            <button class="csv-clear-btn" id="requirements-csv-clear" style="display:none;" onclick="clearCsv('requirements')">✕</button>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- 메인 3단 -->
<div class="main">

  <!-- 좌: 와이어프레임 -->
  <div class="col wf-col">
    <div class="col-title">Wireframe</div>

    <div class="upload-area" id="upload-area" onclick="document.getElementById('img-input').click()">
      <div style="font-size:22px; color:#b4b2a9;">↑</div>
      <p>클릭 / Drag&amp;Drop / Ctrl+V</p>
      <input type="file" id="img-input" accept="image/*" style="display:none;" onchange="handleImage(event)">
    </div>

    <div class="preview-wrap" id="preview-wrap">
      <img id="preview" alt="업로드된 와이어프레임">
      <button class="remove-btn" onclick="removeImage()" aria-label="이미지 제거">✕</button>
    </div>

    <div style="display:flex; gap:10px; flex:1; min-height:0;">
      <div class="card" style="flex:1;">
        <div class="card-label-row">
          <label>Component List <span style="color:#e24b4a;">*</span></label>
        </div>
        <textarea id="components" placeholder="예시)&#10;1. 헤더 타이틀&#10;2. 검색 바&#10;3. 필터 버튼&#10;4. 결과 목록"></textarea>
      </div>
      <div class="card" style="flex:1;">
        <div class="card-label-row">
          <label>추가 지침</label>
        </div>
        <textarea id="instructions" placeholder="추가 지침이 있는 경우 입력하세요."></textarea>
      </div>
    </div>
  </div>

  <!-- 중앙: 생성 버튼 -->
  <div class="generate-col">
    <div class="run-btn-wrap show-tooltip" id="run-btn-wrap">
      <button class="run-btn" id="run-btn" onclick="generate()" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
      <div class="run-btn-tooltip">이미지를 업로드하고<br>컴포넌트 목록을 입력하세요.</div>
    </div>
    <span class="run-btn-label">생성</span>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <!-- 우: 결과 -->
  <div class="col result-col">
    <div class="output-header">
      <span class="col-title" style="margin-bottom:0;">Description</span>
      <div class="btn-group">
        <button class="copy-btn" onclick="copyResult()">복사</button>
        <button class="copy-btn" onclick="downloadMd()">md 다운로드</button>
        <button class="download-btn" onclick="openGhModal()">↑ GitHub</button>
      </div>
    </div>
    <div class="output-box" id="output" contenteditable="true" spellcheck="false">
      <div class="output-empty">생성 버튼을 누르면 디스크립션이 생성됩니다.</div>
    </div>
  </div>

</div>

<!-- GitHub 업로드 모달 -->
<div class="modal-overlay" id="gh-modal" onclick="if(event.target===this)closeGhModal()">
  <div class="modal">
    <div class="modal-title">↑ GitHub에 업로드</div>
    <div class="modal-field">
      <label>GitHub Token (Contents: Write)</label>
      <input type="password" id="gh-token" placeholder="github_pat_..." autocomplete="off">
    </div>
    <div class="modal-field">
      <label>Repository</label>
      <input type="text" id="gh-repo" placeholder="owner/repo (예: danashin-shopl/shopl-pm)">
    </div>
    <div class="modal-field">
      <label>경로 / 파일명</label>
      <input type="text" id="gh-path" placeholder="common/FE/파일명.md">
    </div>
    <div class="modal-status" id="gh-status"></div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeGhModal()">취소</button>
      <button class="modal-confirm" id="gh-upload-btn" onclick="uploadToGithub()">업로드</button>
    </div>
  </div>
</div>

<script>
let imageBase64 = null;
let imageType = null;
const fieldData = { policy: '', requirements: '' };
let currentModel = 'gemini';

// 조직 공용 Gemini API Key (고정)
const GEMINI_FIXED_KEY = 'AIzaSyAjE7ljs05nwZxR0uCR88xG7amn6Oet7N8';

function switchModel(model) {
  currentModel = model;
  document.getElementById('model-claude').classList.toggle('active', model === 'claude');
  document.getElementById('model-gemini').classList.toggle('active', model === 'gemini');
  const wrap = document.getElementById('api-key-wrap');
  if (model === 'claude') {
    wrap.style.visibility = '';
    document.getElementById('api-key').value = localStorage.getItem('anthropic_api_key') || '';
  } else {
    wrap.style.visibility = 'hidden'; // 공간 유지, 공용 키 고정 사용
  }
}

async function fetchUrl(field) {
  const url = document.getElementById(`${field}-url`).value.trim();
  if (!url) return;
  const btn = document.getElementById(`${field}-fetch-btn`);
  btn.disabled = true;
  btn.textContent = '불러오는 중...';
  updateStatusDot(field);
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    fieldData[field] = await res.text();
    updateStatusDot(field);
  } catch (e) {
    alert(`불러오기 실패: ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = '불러오기';
  }
}

function loadCsv(e, targetId) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const lines = ev.target.result.split('\n').map(l => l.replace(/^"|"$/g, '').trim()).filter(l => l);
    fieldData[targetId] = lines.join('\n');
    document.getElementById(`${targetId}-fname`).textContent = file.name;
    document.getElementById(`${targetId}-csv-clear`).style.display = 'inline';
    updateStatusDot(targetId);
    e.target.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

function clearCsv(field) {
  fieldData[field] = '';
  document.getElementById(`${field}-fname`).textContent = '';
  document.getElementById(`${field}-csv-clear`).style.display = 'none';
  updateStatusDot(field);
}

function switchPolicyMode(mode) {
  document.getElementById('policy-url-row').style.display = mode === 'url' ? 'flex' : 'none';
  document.getElementById('policy-csv-row').style.display = mode === 'csv' ? 'flex' : 'none';
  document.getElementById('policy-mode-url').classList.toggle('active', mode === 'url');
  document.getElementById('policy-mode-csv').classList.toggle('active', mode === 'csv');
}

function toggleContext() {
  document.getElementById('context-section').classList.toggle('collapsed');
}

function updateStatusDot(field) {
  const loaded = !!fieldData[field];
  const dotId = field === 'policy' ? 'policy-dot' : 'requirements-dot';
  const badgeId = field === 'policy' ? 'badge-common' : 'badge-policy';
  document.getElementById(dotId).classList.toggle('loaded', loaded);
  document.getElementById(badgeId).classList.toggle('loaded', loaded);
}

function handleImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const result = ev.target.result;
    imageBase64 = result.split(',')[1];
    imageType = file.type;
    document.getElementById('preview').src = result;
    document.getElementById('preview-wrap').style.display = 'block';
    document.getElementById('upload-area').style.display = 'none';
    checkRunnable();
  };
  reader.readAsDataURL(file);
}

function removeImage() {
  imageBase64 = null; imageType = null;
  document.getElementById('preview-wrap').style.display = 'none';
  document.getElementById('upload-area').style.display = 'flex';
  document.getElementById('img-input').value = '';
  checkRunnable();
}

function copyResult() {
  const text = document.getElementById('output').innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '복사됨';
    setTimeout(() => btn.textContent = '복사', 1500);
  }).catch(() => {});
}

function downloadMd() {
  const text = document.getElementById('output').innerText;
  if (!text.trim() || text.includes('생성 버튼')) return;
  const now = new Date();
  const ts = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `wf_description_${ts}.md`;
  a.click();
}

const SYSTEM_PROMPT = `너는 B2B SaaS 기획서의 와이어프레임 Description을 작성하는 전문가야.
아래 규칙을 반드시 따라서 작성해.

## 작성 규칙
- 문체: 개조식 명사형 ("~된다" 아닌 "~형태", "~처리", "~노출")
- 컴포넌트명: 굵게 표기 + 괄호로 UI 유형 명시 (예: 정보 항목 선택(Tabs))
- 내용: bullet 형태, 조건/예외/하위 정책은 들여쓰기로 처리
- 상태 기술 순서: 기본 → 조건부 → 예외/엣지케이스
- 권한, 실시간 반영 여부, 파일명 규칙 등 정책성 내용은 반드시 포함
- 각 번호는 줄바꿈으로 구분해서 출력

## 출력 형식 예시
1
**컴포넌트명(UI유형)**
• 기본 동작 설명
  • 조건부 케이스
  • 예외 처리`;

function buildUserText(components, instructions) {
  const textParts = [];
  if (fieldData.policy) textParts.push(`## 공통 정책\n${fieldData.policy}`);
  if (fieldData.requirements) textParts.push(`## Policy\n${fieldData.requirements}`);
  textParts.push(`## 와이어프레임 컴포넌트 목록\n${components}`);
  if (instructions) textParts.push(`## 추가 지침\n${instructions}`);
  textParts.push('위 와이어프레임 이미지의 번호 마커를 참고해서 각 컴포넌트의 Description을 작성해줘.');
  return textParts.join('\n\n');
}

async function callClaude(apiKey, components, instructions) {
  const userContent = [
    { type: 'image', source: { type: 'base64', media_type: imageType, data: imageBase64 } },
    { type: 'text', text: buildUserText(components, instructions) }
  ];
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 2000,
      system: SYSTEM_PROMPT,
      messages: [{ role: 'user', content: userContent }]
    })
  });
  const data = await response.json();
  if (data.error) throw new Error(data.error.message || 'Claude API 오류');
  return data.content?.map(b => b.text || '').join('') || '';
}

async function callGemini(components, instructions) {
  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_FIXED_KEY}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: [{
          role: 'user',
          parts: [
            { inline_data: { mime_type: imageType, data: imageBase64 } },
            { text: buildUserText(components, instructions) }
          ]
        }]
      })
    }
  );
  const data = await response.json();
  if (data.error) throw new Error(data.error.message || 'Gemini API 오류');
  return data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
}

async function generate() {
  const apiKey = document.getElementById('api-key').value.trim();
  const components = document.getElementById('components').value.trim();
  const instructions = document.getElementById('instructions').value.trim();

  if (currentModel === 'claude' && !apiKey) { showError('API Key를 입력해줘.'); return; }
  if (!components) { showError('컴포넌트 목록을 입력해줘.'); return; }
  if (!imageBase64) { showError('이미지를 업로드해줘.'); return; }

  hideError();
  document.getElementById('run-btn').disabled = true;

  const output = document.getElementById('output');
  output.innerHTML = '<div class="output-empty">생성 중...</div>';

  try {
    const text = currentModel === 'gemini'
      ? await callGemini(components, instructions)
      : await callClaude(apiKey, components, instructions);
    output.style.whiteSpace = 'pre-wrap';
    output.textContent = text;
  } catch (err) {
    showError('요청 실패');
    output.innerHTML = `<div class="output-empty" style="color:#a32d2d; font-size:11px; white-space:pre-wrap; text-align:left; padding:4px;">${err.message}</div>`;
    console.error(err);
  } finally {
    checkRunnable();
  }
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.style.display = 'block';
}
function hideError() {
  document.getElementById('error-msg').style.display = 'none';
}

// 이미지 드래그&드롭
const area = document.getElementById('upload-area');
area.addEventListener('dragover', (e) => { e.preventDefault(); area.classList.add('drag-over'); });
area.addEventListener('dragleave', () => area.classList.remove('drag-over'));
area.addEventListener('drop', (e) => {
  e.preventDefault(); area.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) handleImage({ target: { files: [file] } });
});

// URL 입력 엔터
['policy', 'requirements'].forEach(field => {
  document.getElementById(`${field}-url`).addEventListener('keydown', (e) => {
    if (e.key === 'Enter') fetchUrl(field);
  });
});

// 클립보드 이미지 붙여넣기
document.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      handleImage({ target: { files: [item.getAsFile()] } });
      break;
    }
  }
});

// 생성 버튼 활성화 조건 체크
function checkRunnable() {
  const hasImage = !!imageBase64;
  const hasComponents = !!document.getElementById('components').value.trim();
  const canRun = hasImage && hasComponents;
  document.getElementById('run-btn').disabled = !canRun;
  document.getElementById('run-btn-wrap').classList.toggle('show-tooltip', !canRun);
}

document.getElementById('components').addEventListener('input', checkRunnable);

// ── GitHub 업로드 ──────────────────────────────────────────────
function openGhModal() {
  const text = document.getElementById('output').innerText;
  if (!text.trim() || text.includes('생성 버튼')) return;

  document.getElementById('gh-token').value = localStorage.getItem('github_upload_pat') || '';
  document.getElementById('gh-repo').value  = localStorage.getItem('github_upload_repo') || '';
  document.getElementById('gh-path').value  = localStorage.getItem('github_upload_path') || '';

  const status = document.getElementById('gh-status');
  status.style.display = 'none';
  status.className = 'modal-status';
  document.getElementById('gh-upload-btn').disabled = false;
  document.getElementById('gh-upload-btn').textContent = '업로드';
  document.getElementById('gh-modal').classList.add('open');
}

function closeGhModal() {
  document.getElementById('gh-modal').classList.remove('open');
}

async function uploadToGithub() {
  const token = document.getElementById('gh-token').value.trim();
  const repo  = document.getElementById('gh-repo').value.trim();
  const path  = document.getElementById('gh-path').value.trim();
  const text  = document.getElementById('output').innerText;

  if (!token || !repo || !path) {
    setGhStatus('Token, Repository, 경로를 모두 입력해줘.', true); return;
  }

  localStorage.setItem('github_upload_pat',  token);
  localStorage.setItem('github_upload_repo', repo);
  localStorage.setItem('github_upload_path', path);

  const btn = document.getElementById('gh-upload-btn');
  btn.disabled = true;
  btn.textContent = '업로드 중...';
  setGhStatus('', false);

  const apiUrl = `https://api.github.com/repos/${repo}/contents/${path}`;
  const headers = {
    'Authorization': `Bearer ${token}`,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };

  try {
    // 기존 파일 SHA 조회 (업데이트 시 필요)
    let sha = null;
    const check = await fetch(apiUrl, { headers });
    if (check.ok) { const d = await check.json(); sha = d.sha; }

    const body = {
      message: `docs: ${path.split('/').pop()}`,
      content: btoa(unescape(encodeURIComponent(text)))
    };
    if (sha) body.sha = sha;

    const res = await fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'GitHub API 오류');

    setGhStatus(sha ? '파일 업데이트 완료 ✓' : '업로드 완료 ✓', false);
    btn.textContent = '완료';
  } catch (err) {
    setGhStatus(`실패: ${err.message}`, true);
    btn.disabled = false;
    btn.textContent = '업로드';
  }
}

function setGhStatus(msg, isError) {
  const el = document.getElementById('gh-status');
  el.textContent = msg;
  el.className = 'modal-status' + (isError ? ' error' : '');
  el.style.display = msg ? 'block' : 'none';
}

// 초기 모델 상태 반영 (Gemini 기본)
document.getElementById('api-key-wrap').style.visibility = 'hidden';

// API Key 로컬 저장 (모델별 분리)
const savedClaudeKey = localStorage.getItem('anthropic_api_key');
if (savedClaudeKey) document.getElementById('api-key').value = savedClaudeKey;
document.getElementById('api-key').addEventListener('change', (e) => {
  if (e.target.value) {
    const storageKey = currentModel === 'claude' ? 'anthropic_api_key' : 'gemini_api_key';
    localStorage.setItem(storageKey, e.target.value);
  }
});
