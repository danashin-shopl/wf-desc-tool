<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WF Description 생성기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    background: #f5f4f0;
    color: #1a1a18;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* 상단 바 */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: #fff;
    border-bottom: 0.5px solid #e0dfd8;
    flex-shrink: 0;
  }
  .top-bar h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .top-bar p { font-size: 12px; color: #888780; margin-top: 2px; }

  .api-key-wrap {
    display: flex; align-items: center; gap: 8px;
    background: #f5f4f0; border: 0.5px solid #d3d1c7;
    border-radius: 8px; padding: 6px 12px;
  }
  .api-key-wrap label { font-size: 11px; color: #888780; font-weight: 500; white-space: nowrap; }
  .api-key-wrap input {
    border: none; outline: none; font-size: 12px;
    font-family: inherit; color: #1a1a18; background: transparent; width: 220px;
  }
  .api-key-wrap input::placeholder { color: #b4b2a9; }

  /* 상단 입력 섹션 */
  .input-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: #fff;
    border-bottom: 0.5px solid #e0dfd8;
    flex-shrink: 0;
  }

  .input-col {
    padding: 10px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .input-col:first-child { border-right: 0.5px solid #e0dfd8; }

  .input-col-label {
    font-size: 11px; font-weight: 600; color: #b4b2a9;
    letter-spacing: 0.5px; text-transform: uppercase;
  }

  .url-row { display: flex; gap: 6px; align-items: center; }
  .url-input {
    flex: 1; border: 0.5px solid #d3d1c7; border-radius: 6px;
    padding: 5px 10px; font-size: 12px; font-family: inherit;
    color: #1a1a18; background: #fafaf8; outline: none;
  }
  .url-input:focus { border-color: #888780; background: #fff; }
  .url-input::placeholder { color: #b4b2a9; }

  .fetch-btn {
    font-size: 11px; font-family: inherit; padding: 4px 10px;
    background: #f5f4f0; border: 0.5px solid #d3d1c7; border-radius: 5px;
    cursor: pointer; color: #5f5e5a; white-space: nowrap; flex-shrink: 0;
    transition: background 0.1s;
  }
  .fetch-btn:hover { background: #e8e7e3; }
  .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .status-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    background: #d3d1c7; transition: background 0.2s;
  }
  .status-dot.loaded { background: #3daf6e; }

  .csv-row { display: flex; gap: 6px; align-items: center; }
  .csv-upload-btn {
    font-size: 11px; font-family: inherit; padding: 4px 10px;
    background: #f5f4f0; border: 0.5px solid #d3d1c7; border-radius: 5px;
    cursor: pointer; color: #5f5e5a; flex-shrink: 0; transition: background 0.1s;
  }
  .csv-upload-btn:hover { background: #e8e7e3; }
  .csv-fname {
    font-size: 11px; color: #888780; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .csv-clear-btn {
    background: none; border: none; cursor: pointer;
    font-size: 12px; color: #b4b2a9; padding: 0; line-height: 1; flex-shrink: 0;
  }
  .csv-clear-btn:hover { color: #5f5e5a; }

  /* 메인 2단 */
  .main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  .col {
    padding: 16px;
    border-right: 0.5px solid #e0dfd8;
    display: flex; flex-direction: column; gap: 10px;
    height: 100%;
    overflow: hidden;
  }
  .col:last-child { border-right: none; }

  .col-title {
    font-size: 11px; font-weight: 600; color: #b4b2a9;
    letter-spacing: 0.5px; text-transform: uppercase; flex-shrink: 0;
  }

  .card {
    background: #fff; border-radius: 10px;
    border: 0.5px solid #e0dfd8; padding: 12px 14px;
    display: flex; flex-direction: column;
    min-height: 0; overflow: hidden;
  }

  .card-label-row {
    display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 6px; flex-shrink: 0;
  }
  .card-label-row label { font-size: 11px; color: #888780; font-weight: 500; }
  .csv-btn {
    font-size: 11px; font-family: inherit; padding: 2px 7px;
    background: #f5f4f0; border: 0.5px solid #d3d1c7; border-radius: 4px;
    cursor: pointer; color: #888780; transition: background 0.1s;
  }
  .csv-btn:hover { background: #e8e7e3; }

  textarea {
    width: 100%; border: none; outline: none; resize: none;
    font-size: 12px; font-family: inherit; color: #1a1a18;
    background: transparent; line-height: 1.7;
    flex: 1; min-height: 60px; overflow-y: auto;
  }
  textarea::placeholder { color: #b4b2a9; }

  .upload-area {
    border-radius: 10px; border: 1.5px dashed #d3d1c7;
    text-align: center; cursor: pointer; flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
    height: 260px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #fff;
  }
  .upload-area:hover { background: #f9f8f4; border-color: #b4b2a9; }
  .upload-area.drag-over { background: #eef5fb; border-color: #378add; }
  .upload-area p { font-size: 12px; color: #888780; margin-top: 4px; }
  .upload-area span { font-size: 11px; color: #b4b2a9; }

  .preview-wrap { display: none; position: relative; flex-shrink: 0; height: 260px; }
  .preview-wrap img {
    width: 100%; height: 100%; object-fit: contain;
    border-radius: 10px; border: 0.5px solid #e0dfd8; display: block;
  }
  .remove-btn {
    position: absolute; top: 6px; right: 6px;
    background: #fff; border: 0.5px solid #d3d1c7; border-radius: 50%;
    width: 24px; height: 24px; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    color: #5f5e5a; transition: background 0.1s;
  }
  .remove-btn:hover { background: #f5f4f0; }

  .run-btn {
    width: 100%; padding: 10px; font-size: 13px; font-family: inherit;
    font-weight: 500; background: #1a1a18; color: #f5f4f0;
    border: none; border-radius: 10px; cursor: pointer;
    transition: opacity 0.15s; flex-shrink: 0;
  }
  .run-btn:hover { opacity: 0.85; }
  .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .output-header {
    display: flex; align-items: center;
    justify-content: space-between; flex-shrink: 0;
  }
  .btn-group { display: flex; gap: 6px; }

  .copy-btn {
    font-size: 11px; font-family: inherit; padding: 3px 10px;
    background: #fff; border: 0.5px solid #d3d1c7; border-radius: 5px;
    cursor: pointer; color: #5f5e5a; transition: background 0.1s;
  }
  .copy-btn:hover { background: #f5f4f0; }

  .download-btn {
    font-size: 11px; font-family: inherit; padding: 3px 10px;
    background: #1a1a18; border: 0.5px solid #1a1a18; border-radius: 5px;
    cursor: pointer; color: #f5f4f0; transition: opacity 0.1s;
  }
  .download-btn:hover { opacity: 0.8; }

  .output-box {
    background: #fff; border-radius: 10px; border: 0.5px solid #e0dfd8;
    padding: 14px; font-size: 12px; line-height: 1.9;
    white-space: pre-wrap; color: #1a1a18; flex: 1; overflow-y: auto;
    outline: none; cursor: text; min-height: 0;
  }
  .output-box:focus { border-color: #b4b2a9; }
  .output-empty {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: #b4b2a9; font-size: 12px;
  }

  .error-msg {
    display: none; padding: 8px 12px; background: #fcebeb;
    border-radius: 8px; font-size: 12px; color: #a32d2d; flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <h1>WF Description 생성기</h1>
    <p>공통 정책 + 요구사항 + 와이어프레임 → Description 자동 작성</p>
  </div>
  <div class="api-key-wrap">
    <label for="api-key">API Key</label>
    <input type="password" id="api-key" placeholder="sk-ant-..." autocomplete="off">
  </div>
</div>

<!-- 상단 입력 섹션 -->
<div class="input-section">
  <div class="input-col">
    <div class="input-col-label">공통 정책</div>
    <div class="url-row">
      <input type="text" class="url-input" id="policy-url" placeholder="GitHub Raw URL 입력 후 Enter">
      <button class="fetch-btn" id="policy-fetch-btn" onclick="fetchUrl('policy')">불러오기</button>
      <div class="status-dot" id="policy-dot"></div>
    </div>
    <div class="csv-row">
      <button class="csv-upload-btn" onclick="document.getElementById('csv-policy').click()">↑ CSV 업로드</button>
      <input type="file" id="csv-policy" accept=".csv" style="display:none;" onchange="loadCsv(event,'policy')">
      <span class="csv-fname" id="policy-fname"></span>
      <button class="csv-clear-btn" id="policy-csv-clear" style="display:none;" onclick="clearCsv('policy')">✕</button>
    </div>
  </div>

  <div class="input-col">
    <div class="input-col-label">기능 요구사항</div>
    <div class="url-row">
      <input type="text" class="url-input" id="requirements-url" placeholder="GitHub Raw URL 입력 후 Enter">
      <button class="fetch-btn" id="requirements-fetch-btn" onclick="fetchUrl('requirements')">불러오기</button>
      <div class="status-dot" id="requirements-dot"></div>
    </div>
    <div class="csv-row">
      <button class="csv-upload-btn" onclick="document.getElementById('csv-requirements').click()">↑ CSV 업로드</button>
      <input type="file" id="csv-requirements" accept=".csv" style="display:none;" onchange="loadCsv(event,'requirements')">
      <span class="csv-fname" id="requirements-fname"></span>
      <button class="csv-clear-btn" id="requirements-csv-clear" style="display:none;" onclick="clearCsv('requirements')">✕</button>
    </div>
  </div>
</div>

<!-- 메인 2단 -->
<div class="main">

  <!-- 좌: 와이어프레임 -->
  <div class="col">
    <div class="col-title">와이어프레임</div>

    <div class="upload-area" id="upload-area" onclick="document.getElementById('img-input').click()">
      <div style="font-size:22px; color:#b4b2a9;">↑</div>
      <p>이미지 업로드 <span style="color:#e24b4a;">*</span></p>
      <span>클릭, 드래그, 또는 Ctrl+V로 붙여넣기</span>
      <input type="file" id="img-input" accept="image/*" style="display:none;" onchange="handleImage(event)">
    </div>

    <div class="preview-wrap" id="preview-wrap">
      <img id="preview" alt="업로드된 와이어프레임">
      <button class="remove-btn" onclick="removeImage()" aria-label="이미지 제거">✕</button>
    </div>

    <div class="card" style="flex:1;">
      <div class="card-label-row">
        <label>컴포넌트 목록 <span style="color:#e24b4a;">*</span></label>
        <button class="csv-btn" onclick="document.getElementById('csv-components').click()">↑ CSV</button>
        <input type="file" id="csv-components" accept=".csv" style="display:none;" onchange="loadCsv(event,'components')">
      </div>
      <textarea id="components" placeholder="예) 1. 정보 항목 선택 탭&#10;2. 정렬 드롭다운&#10;3. 0인 값 숨기기 필터&#10;4. 다운로드 버튼"></textarea>
    </div>

    <button class="run-btn" id="run-btn" onclick="generate()">Description 생성</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <!-- 우: 결과 -->
  <div class="col">
    <div class="output-header">
      <span class="col-title" style="margin-bottom:0;">결과</span>
      <div class="btn-group">
        <button class="copy-btn" onclick="copyResult()">복사</button>
        <button class="download-btn" onclick="downloadMd()">md 다운로드</button>
      </div>
    </div>
    <div class="output-box" id="output" contenteditable="true" spellcheck="false">
      <div class="output-empty">Description 생성 버튼을 누르면 여기에 결과가 나와요</div>
    </div>
  </div>

</div>

<script>
let imageBase64 = null;
let imageType = null;
const fieldData = { policy: '', requirements: '' };

async function fetchUrl(field) {
  const url = document.getElementById(`${field}-url`).value.trim();
  if (!url) return;
  const btn = document.getElementById(`${field}-fetch-btn`);
  const dot = document.getElementById(`${field}-dot`);
  btn.disabled = true;
  btn.textContent = '불러오는 중...';
  dot.classList.remove('loaded');
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    fieldData[field] = await res.text();
    dot.classList.add('loaded');
  } catch (e) {
    alert(`불러오기 실패: ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = '불러오기';
  }
}

function loadCsv(e, targetId) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const lines = ev.target.result.split('\n').map(l => l.replace(/^"|"$/g, '').trim()).filter(l => l);
    if (targetId === 'policy' || targetId === 'requirements') {
      fieldData[targetId] = lines.join('\n');
      document.getElementById(`${targetId}-fname`).textContent = file.name;
      document.getElementById(`${targetId}-csv-clear`).style.display = 'inline';
      document.getElementById(`${targetId}-dot`).classList.add('loaded');
    } else {
      document.getElementById(targetId).value = lines.join('\n');
    }
    e.target.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

function clearCsv(field) {
  fieldData[field] = '';
  document.getElementById(`${field}-fname`).textContent = '';
  document.getElementById(`${field}-csv-clear`).style.display = 'none';
  document.getElementById(`${field}-dot`).classList.remove('loaded');
}

function handleImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const result = ev.target.result;
    imageBase64 = result.split(',')[1];
    imageType = file.type;
    document.getElementById('preview').src = result;
    document.getElementById('preview-wrap').style.display = 'block';
    document.getElementById('upload-area').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function removeImage() {
  imageBase64 = null; imageType = null;
  document.getElementById('preview-wrap').style.display = 'none';
  document.getElementById('upload-area').style.display = 'flex';
  document.getElementById('img-input').value = '';
}

function copyResult() {
  const text = document.getElementById('output').innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '복사됨';
    setTimeout(() => btn.textContent = '복사', 1500);
  }).catch(() => {});
}

function downloadMd() {
  const text = document.getElementById('output').innerText;
  if (!text.trim() || text.includes('Description 생성 버튼')) return;
  const now = new Date();
  const ts = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `wf_description_${ts}.md`;
  a.click();
}

async function generate() {
  const apiKey = document.getElementById('api-key').value.trim();
  const components = document.getElementById('components').value.trim();

  if (!apiKey) { showError('Anthropic API Key를 입력해줘.'); return; }
  if (!components) { showError('컴포넌트 목록을 입력해줘.'); return; }
  if (!imageBase64) { showError('와이어프레임 이미지를 업로드해줘.'); return; }

  hideError();
  const btn = document.getElementById('run-btn');
  btn.disabled = true; btn.textContent = '생성 중...';

  const output = document.getElementById('output');
  output.innerHTML = '<div class="output-empty">생성 중...</div>';

  const systemPrompt = `너는 B2B SaaS 기획서의 와이어프레임 Description을 작성하는 전문가야.
아래 규칙을 반드시 따라서 작성해.

## 작성 규칙
- 문체: 개조식 명사형 ("~된다" 아닌 "~형태", "~처리", "~노출")
- 컴포넌트명: 굵게 표기 + 괄호로 UI 유형 명시 (예: 정보 항목 선택(Tabs))
- 내용: bullet 형태, 조건/예외/하위 정책은 들여쓰기로 처리
- 상태 기술 순서: 기본 → 조건부 → 예외/엣지케이스
- 권한, 실시간 반영 여부, 파일명 규칙 등 정책성 내용은 반드시 포함
- 각 번호는 줄바꿈으로 구분해서 출력

## 출력 형식 예시
1
**컴포넌트명(UI유형)**
• 기본 동작 설명
  • 조건부 케이스
  • 예외 처리`;

  const userContent = [
    { type: 'image', source: { type: 'base64', media_type: imageType, data: imageBase64 } }
  ];

  const textParts = [];
  if (fieldData.policy) textParts.push(`## 공통 정책\n${fieldData.policy}`);
  if (fieldData.requirements) textParts.push(`## 기능 요구사항\n${fieldData.requirements}`);
  textParts.push(`## 와이어프레임 컴포넌트 목록\n${components}`);
  textParts.push('위 와이어프레임 이미지의 번호 마커를 참고해서 각 컴포넌트의 Description을 작성해줘.');
  userContent.push({ type: 'text', text: textParts.join('\n\n') });

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 2000,
        system: systemPrompt,
        messages: [{ role: 'user', content: userContent }]
      })
    });

    const data = await response.json();
    if (data.error) {
      showError(`API 오류: ${data.error.message}`);
      output.innerHTML = '<div class="output-empty">오류가 발생했어요</div>';
    } else {
      const text = data.content?.map(b => b.text || '').join('') || '';
      output.style.whiteSpace = 'pre-wrap';
      output.textContent = text;
    }
  } catch (err) {
    showError(`요청 실패: ${err.message}`);
    output.innerHTML = '<div class="output-empty">오류가 발생했어요</div>';
  } finally {
    btn.disabled = false; btn.textContent = 'Description 생성';
  }
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.style.display = 'block';
}
function hideError() {
  document.getElementById('error-msg').style.display = 'none';
}

// 이미지 드래그&드롭
const area = document.getElementById('upload-area');
area.addEventListener('dragover', (e) => { e.preventDefault(); area.classList.add('drag-over'); });
area.addEventListener('dragleave', () => area.classList.remove('drag-over'));
area.addEventListener('drop', (e) => {
  e.preventDefault(); area.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) handleImage({ target: { files: [file] } });
});

// URL 입력 엔터
['policy', 'requirements'].forEach(field => {
  document.getElementById(`${field}-url`).addEventListener('keydown', (e) => {
    if (e.key === 'Enter') fetchUrl(field);
  });
});

// 클립보드 이미지 붙여넣기
document.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      handleImage({ target: { files: [item.getAsFile()] } });
      break;
    }
  }
});

// API Key 로컬 저장
const savedKey = localStorage.getItem('anthropic_api_key');
if (savedKey) document.getElementById('api-key').value = savedKey;
document.getElementById('api-key').addEventListener('change', (e) => {
  if (e.target.value) localStorage.setItem('anthropic_api_key', e.target.value);
});
</script>
</body>
</html>
